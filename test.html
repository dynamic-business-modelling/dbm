<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اختبار Supabase</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial; padding: 50px; text-align: center;">

    <h2>اختبار اتصال بسيط</h2>
    <input type="text" id="msg" placeholder="اكتب أي كلمة هنا" style="padding: 10px; width: 300px;">
    <br><br>
    <button onclick="sendData()" style="padding: 10px 20px; background: blue; color: white; border: none; cursor: pointer;">إرسال</button>
    
    <p id="result" style="margin-top: 20px; font-weight: bold;"></p>
    <p id="debug" style="margin-top: 10px; font-size: 12px; color: gray;"></p>

    <script>
        const SUPABASE_URL = 'https://fhzrzfzabpyhyaxwibbv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoenJ6ZnphYnB5aHlheHdpYmJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNDk2NDgsImV4cCI6MjA5NzkyNTY0OH0.vYysPXl1LuSJnhOULzCqnbdefm6Si1UspgwMSmDCnLY';
        
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function sendData() {
            const message = document.getElementById('msg').value;
            const resultText = document.getElementById('result');
            const debugText = document.getElementById('debug');
            
            resultText.innerText = "جاري الإرسال...";
            debugText.innerText = "";

            // اختبار 1: هل الاتصال يعمل؟
            try {
                const { data: pingData, error: pingError } = await supabase
                    .from('test_form')
                    .select('*')
                    .limit(1);
                
                if (pingError) {
                    debugText.innerText = "خطأ في الاتصال: " + pingError.message;
                    resultText.innerText = " فشل الاتصال";
                    resultText.style.color = "red";
                    return;
                }
                debugText.innerText = "✅ الاتصال نجح! جاري الإرسال...";
            } catch (e) {
                debugText.innerText = "خطأ غير متوقع: " + e.message;
                return;
            }

            // اختبار 2: محاولة الإدخال
            const { data, error } = await supabase
                .from('test_form')
                .insert([{ test_message: message }]);

            if (error) {
                console.error("الخطأ:", error);
                resultText.innerText = "❌ فشل: " + error.message;
                resultText.style.color = "red";
                debugText.innerText = "تفاصيل: " + JSON.stringify(error);
            } else {
                resultText.innerText = "✅ نجح! البيانات وصلت";
                resultText.style.color = "green";
                debugText.innerText = "البيانات المرسلة: " + JSON.stringify(data);
            }
        }
    </script>
</body>
</html>
