<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body style="font-family: Arial; padding: 20px; text-align: center;">

    <h1>اختبار بسيط</h1>
    
    <div id="status" style="background: yellow; padding: 10px; margin: 20px 0; border-radius: 5px;">
        جاري التحميل...
    </div>

    <input type="text" id="msg" placeholder="اكتب كلمة هنا" style="padding: 10px; width: 300px; margin: 10px;">
    <br>
    <button id="sendBtn" style="padding: 10px 20px; background: blue; color: white; border: none; border-radius: 5px; cursor: pointer;">إرسال</button>
    
    <div id="result" style="margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 5px;"></div>

    <script>
        // اختبار أن الصفحة تحمّلت
        document.getElementById('status').innerHTML = '✅ الصفحة تحمّلت';
        document.getElementById('status').style.background = 'lightgreen';

        const SUPABASE_URL = 'https://fhzrzfzabpyhyaxwibbv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoenJ6ZnphYnB5aHlheHdpYmJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNDk2NDgsImV4cCI6MjA5NzkyNTY0OH0.vYysPXl1LuSJnhOULzCqnbdefm6Si1UspgwMSmDCnLY';
        
        let supabase;
        
        try {
            supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            document.getElementById('status').innerHTML = '✅ تم الاتصال بـ Supabase';
        } catch (e) {
            document.getElementById('status').innerHTML = '❌ خطأ: ' + e.message;
            document.getElementById('status').style.background = 'red';
        }

        // استخدام addEventListener بدلاً من onclick
        document.getElementById('sendBtn').addEventListener('click', async function() {
            const message = document.getElementById('msg').value;
            const resultDiv = document.getElementById('result');
            
            if (!message) {
                resultDiv.innerHTML = '⚠️ اكتب كلمة أولاً!';
                resultDiv.style.background = '#fff3cd';
                return;
            }
            
            resultDiv.innerHTML = '⏳ جاري الإرسال...';
            resultDiv.style.background = '#cce5ff';

            try {
                const { data, error } = await supabase
                    .from('test_form')
                    .insert([{ test_message: message }]);

                if (error) {
                    console.error('الخطأ:', error);
                    resultDiv.innerHTML = '❌ فشل: ' + error.message;
                    resultDiv.style.background = '#f8d7da';
                } else {
                    resultDiv.innerHTML = '✅ نجح! تم إرسال: ' + message;
                    resultDiv.style.background = '#d4edda';
                }
            } catch (e) {
                resultDiv.innerHTML = '❌ خطأ: ' + e.message;
                resultDiv.style.background = '#f8d7da';
            }
        });
    </script>
</body>
</html>
