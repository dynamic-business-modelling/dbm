<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار</title>
    <!-- استخدام CDN بديل -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/@supabase/supabase-js/2.39.1/supabase.min.js"></script>
</head>
<body style="font-family: Arial; padding: 20px; text-align: center;">

    <h1>اختبار بسيط</h1>
    
    <div id="log" style="background: #f0f0f0; padding: 15px; margin: 20px 0; text-align: right; font-size: 12px; border-radius: 5px;"></div>

    <input type="text" id="msg" placeholder="اكتب كلمة هنا" style="padding: 10px; width: 300px; margin: 10px;">
    <br>
    <button id="sendBtn" style="padding: 10px 20px; background: blue; color: white; border: none; border-radius: 5px; cursor: pointer;">إرسال</button>

    <script>
        const log = document.getElementById('log');
        
        function addLog(msg, color = 'black') {
            log.innerHTML += `<div style="color: ${color}; margin: 5px 0;">${msg}</div>`;
        }

        addLog('1️⃣ بدأت تحميل الصفحة...');

        // اختبار المكتبة
        if (typeof window.supabase === 'undefined') {
            addLog('❌ مكتبة Supabase لم تُحمّل!', 'red');
            addLog(' الحل: تحقق من اتصال الإنترنت', 'blue');
        } else {
            addLog('✅ مكتبة Supabase محملة', 'green');
            
            const SUPABASE_URL = 'https://fhzrzfzabpyhyaxwibbv.supabase.co';
            const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZoenJ6ZnphYnB5aHlheHdpYmJ2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNDk2NDgsImV4cCI6MjA5NzkyNTY0OH0.vYysPXl1LuSJnhOULzCqnbdefm6Si1UspgwMSmDCnLY';
            
            try {
                const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                addLog('✅ تم إنشاء العميل', 'green');
                
                document.getElementById('sendBtn').addEventListener('click', async function() {
                    const message = document.getElementById('msg').value;
                    
                    if (!message) {
                        addLog('️ اكتب كلمة أولاً', 'orange');
                        return;
                    }
                    
                    addLog('📤 جاري الإرسال...', 'blue');
                    
                    const { data, error } = await supabase
                        .from('test_form')
                        .insert([{ test_message: message }]);

                    if (error) {
                        addLog(' فشل: ' + error.message, 'red');
                    } else {
                        addLog('✅ نجح! تم الإرسال', 'green');
                        // تحديث الصفحة لرؤية البيانات في Supabase
                        setTimeout(() => location.reload(), 1000);
                    }
                });
                
            } catch (e) {
                addLog('❌ خطأ: ' + e.message, 'red');
            }
        }
    </script>
</body>
</html>
